async function loadAuthCodes() {
  try {

}

function checkAuth(code) {
  if (!code) return { ok: false, msg: '璇疯緭鍏ヨ闂爜' };
  const c = ACCESS_CODES[code.trim().toUpperCase()];
  if (!c) return { ok: false, msg: '璁块棶鐮佷笉瀛樺湪' };
  if (!c.enabled) return { ok: false, msg: '璁块棶鐮佸凡鍋滅敤' };
  if (new Date() > new Date(c.expire)) return { ok: false, msg: '璁块棶鐮佸凡杩囨湡' };
  return { ok: true, name: c.name };
}

function doLogin(code) {

async function loadFiles(files) {
  document.getElementById('metaInfo').textContent = `鍔犺浇涓? ${files.length} 涓枃浠?..`;
  const allRows = [];
  let firstCols = null;
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    try {
      let rows = [];
      if (ext === 'csv') {
        let text = await file.text();
        if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: false, dynamicTyping: false });
        rows = parsed.data;
        if (rows.length > 0) {
          const oldCols = Object.keys(rows[0]);
          const newCols = oldCols.map(c => c.replace(/^\ufeff/, '').trim());
          if (JSON.stringify(oldCols) !== JSON.stringify(newCols)) {
            rows = rows.map(r => { const nr = {}; oldCols.forEach((c, i) => { nr[newCols[i]] = r[c]; }); return nr; });
          }
        }
      } else {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        // 閬嶅巻鎵€鏈塖heet
        let refCols = null; // 绗竴寮犳湁鏁圫heet鐨勫垪鍚嶄綔涓哄弬鑰?        for (const sn of wb.SheetNames) {
          const ws = wb.Sheets[sn];
          let sheetRows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          if (sheetRows.length === 0) continue;
          // Trim鍒楀ご锛堝鐞?" 鏀粯鏂瑰紡"銆? 鏃ユ湡" 绛夊墠瀵肩┖鏍硷級
          const oldCols = Object.keys(sheetRows[0]);
          let newCols = oldCols.map((c, i) => {
            const t = c.replace(/^\ufeff/, '').trim();
            if (!t && refCols && refCols[i]) return refCols[i]; // 绌哄垪澶粹啋鍙傝€冪涓€寮燬heet
            return t || '_col' + i;
          });
          if (!refCols) refCols = newCols; // 璁板綍鍙傝€冨垪鍚?          if (JSON.stringify(oldCols) !== JSON.stringify(newCols)) {
            sheetRows = sheetRows.map(r => { const nr = {}; oldCols.forEach((c, i) => { nr[newCols[i]] = r[c]; }); return nr; });
          }
          rows.push(...sheetRows);
        }
      }
      if (!firstCols && rows.length > 0) firstCols = Object.keys(rows[0]);
      allRows.push(...rows);
      document.getElementById('metaInfo').textContent = `宸插姞杞?${allRows.length} 琛?(${files.length} 涓枃浠?`;
    } catch (e) { console.error('鏂囦欢璇诲彇澶辫触:', file.name, e); }
  }
  RAW_ROWS = allRows;
  // 鑷姩鏄犲皠
  const cols = Object.keys(RAW_ROWS[0] || {});
  MAPPING = {};
  Object.entries(FIELD_ALIASES).forEach(([std, aliases]) => {
    for (const alias of aliases) {
      if (cols.includes(alias)) { MAPPING[std] = alias; break; }
    }
  });
  document.getElementById('metaInfo').textContent = `${files.length} 涓枃浠?路 ${RAW_ROWS.length} 琛?路 ${cols.length} 鍒梎;
  renderMapping();
  goStep(2);
}

function renderMapping() {
  const cols = Object.keys(RAW_ROWS[0] || {});
  const html = Object.keys(FIELD_ALIASES).map(std => {
    const current = MAPPING[std] || '';
    const status = current ? `<span class="status ok">鉁?${current}</span>` : `<span class="status miss">鏈尮閰?/span>`;
    return `
      <div class="mapping-row">
        <label>${std}</label>
        <div>
          <select data-std="${std}">
            <option value="">(涓嶆槧灏?</option>
            ${cols.map(c => `<option value="${c}" ${c===current?'selected':''}>${c}</option>`).join('')}
          </select>
          ${status}
        </div>
      </div>
    `;
  }).join('');
  document.getElementById('mappingRows').innerHTML = html;
  document.querySelectorAll('.mapping-row select').forEach(sel => {
    sel.addEventListener('change', e => {
      const std = e.target.dataset.std;
      if (e.target.value) MAPPING[std] = e.target.value;
      else delete MAPPING[std];
      renderMapping();
    });
  });
}

function cleanData() {
  const std2col = {};
  Object.entries(MAPPING).forEach(([std, col]) => { std2col[col] = std; });
  
  // 绗?姝? 杞崲鎵€鏈夎(涓嶈烦杩囩┖琛?
  let tempRows = [];
  for (const row of RAW_ROWS) {
    const r = {};
    Object.entries(row).forEach(([k, v]) => {
      const std = std2col[k];
      if (!std) return;
      if (std === '鏃ユ湡') {
        const d = parseDate(v);
        r[std] = d || null;  // 绌鸿鏃ユ湡涓簄ull,涓嶈烦杩?      } else if (std === '搴旀敹' || std === '瀹炴敹') {
        const n = parseFloat(String(v).replace(/[^\d.\-]/g, ''));
        r[std] = isNaN(n) ? 0 : n;
      } else {
        r[std] = String(v || '').trim();
      }
    });
    tempRows.push(r);
  }

function mergeDualPaymentJS(rows) {
  // 鏅鸿兘鍚堝苟"濮撳悕绌?鏃ユ湡绌?瀹炴敹>0+搴旀敹=0"鐨勫绔嬭(绗簩绗旀敮浠?
  // 鍙疮鍔犲疄鏀跺埌涓婁竴琛?鍜孭ython楠岃瘉鑴氭湰瀹屽叏涓€鑷?寰楀埌452鍒濊瘖)
  const out = [];
  for (const r of rows) {
    const nm = String(r['濮撳悕'] || '').trim();
    const dt = r['鏃ユ湡'];
    const ys = parseFloat(r['搴旀敹']) || 0;
    const ss = parseFloat(r['瀹炴敹']) || 0;
    const noDate = !dt || isNaN(dt.getTime());
    if (!nm && noDate && ss > 0 && ys === 0) {
      // 绌鸿:绱姞瀹炴敹鍒颁笂涓€琛?      if (out.length > 0) {
        out[out.length - 1]['瀹炴敹'] = (parseFloat(out[out.length - 1]['瀹炴敹']) || 0) + ss;
      }
    } else {
      out.push({ ...r });
    }
  }
  return out;
}

function parseDate(v) {
  if (!v) return null;
  if (v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  if (!s) return null;
  // Excel搴忓垪鍙?46174=2026-05-31, 鑼冨洿30000~80000瑕嗙洊1982~2119骞?
  const n = Number(s);
  if (!isNaN(n) && n > 30000 && n < 80000) {
    const d = new Date(1899, 11, 30);
    d.setDate(d.getDate() + Math.floor(n));
    return d;
  }
  // 澶勭悊 2026/4/1 2026-4-1 2026.4.1
  const m = s.match(/(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/);
  if (m) {
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    return isNaN(d) ? null : d;
  }
  // 澶勭悊 M.D 鎴?M-D (濡?6.1 6-1 12.25), 榛樿褰撳勾
  const md = s.match(/^(\d{1,2})[\.\-](\d{1,2})$/);
  if (md) {
    const now = new Date();
    const d = new Date(now.getFullYear(), +md[1]-1, +md[2]);
    return isNaN(d) ? null : d;
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function getMonths() {
  const set = new Set();
  CLEANED.forEach(r => {
    if (r['鏃ユ湡'] instanceof Date) {
      const y = r['鏃ユ湡'].getFullYear();
      const m = String(r['鏃ユ湡'].getMonth() + 1).padStart(2, '0');
      set.add(`${y}-${m}`);
    }
  });
  return Array.from(set).sort().reverse();
}

function filterByMonth(rows, ym) {
  // 鐢ㄦ湰鍦版椂闂村垽鏂湀浠?淇鏃跺尯bug: toISOString杞琔TC浼氬亸绉?
  return rows.filter(r => {
    if (!(r['鏃ユ湡'] instanceof Date)) return false;
    const y = r['鏃ユ湡'].getFullYear();
    const m = String(r['鏃ユ湡'].getMonth() + 1).padStart(2, '0');
    return `${y}-${m}` === ym;
  });
}

    data[p] = { fz_n, fz_d, fz_amt, ff_n, ff_d, ff_amt, zxf_n, zxf_d: zxf.filter(isDeal).length, zxf_amt, fc_n, fc_amt, total, unit, ss, ys, sq, tf, hj: ss, ys_no_tf: all_ys, cz1_d };
  });
  return data;
}

// 鍖荤敓涓氱哗鏄庣粏(瀵归綈浜哄伐鎴浘妯℃澘)
function calcDoctorDetail(rows) {
  const validRows = rows.filter(r => !String(r['娌荤枟鏄庣粏'] || '').includes('鏇存崲鍖荤敓'));
  const docGroups = {};
  validRows.forEach(r => {
    const doc = r['鍖荤敓'] || '鏈寚娲?;
    if (!docGroups[doc]) docGroups[doc] = [];
    docGroups[doc].push(r);
  });
  // 鎬诲疄鏀?鍏ㄩ噺瀹炴敹鍜?鐢ㄤ簬涓氱哗鍗犳瘮鍒嗘瘝, 2026-07-08鐢ㄦ埛纭)
  const totalHj = validRows.reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);

  const results = [];
  Object.entries(docGroups).forEach(([doc, sub]) => {
    // 鎴愪氦鍒ゅ畾
    const isDeal = r => {
      if (r['鍒濆璇?] === '閫€璐?) return false;
      const ss = Number(r['瀹炴敹'] || 0);
      const ys = Number(r['搴旀敹'] || 0);
      if ((ss === 0 || ss === 1) && (ys === 0 || ys === 1)) return false;
      if (isNoDeal(r)) return false;
      return true;
    };
    // 鎬诲埌闄? 鍒濊瘖+澶嶈瘖, 鎺掗櫎瀛ょ珛琛?鍒濊瘖1(涓庨」鐩眹鎬诲彛寰勪竴鑷?
    const isFz = r => (r['鍒濆璇?] === '鍒濊瘖' || r['鍒濆璇?] === '澶嶈瘖') && !r._orphan;
    const czFz = sub.filter(isFz);
    const visitBig = czFz.filter(r => BIG_PROJECTS.includes(r['椤圭洰'])).length;
    const visitSmall = czFz.filter(r => SMALL_PROJECTS.includes(r['椤圭洰'])).length;
    // 鎴愪氦鏁?    const dealCzFz = czFz.filter(isDeal);
    const dealBig = dealCzFz.filter(r => BIG_PROJECTS.includes(r['椤圭洰'])).length;
    const dealSmall = dealCzFz.filter(r => SMALL_PROJECTS.includes(r['椤圭洰'])).length;
    // 鎴愪氦鐜?    const rateBig = visitBig > 0 ? dealBig / visitBig : 0;
    const rateSmall = visitSmall > 0 ? dealSmall / visitSmall : 0;
    // 鎴愪氦閲戦: 鍒濊瘖+澶嶈瘖+鍒濊瘖1鐨勫疄鏀? 鍖呭惈瀛ょ珛琛?涓庨」鐩眹鎬诲彛寰勪竴鑷?
    const isFzAmt = r => (r['鍒濆璇?] === '鍒濊瘖' || r['鍒濆璇?] === '澶嶈瘖' || r['鍒濆璇?] === '鍒濊瘖1');
    const czFzAmt = sub.filter(isFzAmt);
    const amtBig = czFzAmt.filter(r => BIG_PROJECTS.includes(r['椤圭洰'])).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    const amtSmall = czFzAmt.filter(r => SMALL_PROJECTS.includes(r['椤圭洰'])).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 瀹炴敹 = 鍏ㄩ噺瀹炴敹鍜?2026-07-08)
    const ss = sub.reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 鏀舵瑺璐? 澶嶆煡搴旀敹=0瀹炴敹>0
    const sq = sub.filter(r => Number(r['搴旀敹']) === 0 && Number(r['瀹炴敹']) > 0 && r['鍒濆璇?] === '澶嶆煡').reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 閫€璐?    const tf = Math.abs(sub.filter(r => r['鍒濆璇?] === '閫€璐?).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0));
    // 鍚堣 = 瀹炴敹(鍏ㄩ噺宸插惈鏀舵瑺璐?閫€璐?
    const hj = ss;

    results.push({
      doc, visitBig, visitSmall, dealBig, dealSmall,
      rateBig, rateSmall, amtBig, amtSmall, ss, sq, tf, hj,
      pct: totalHj > 0 ? hj / totalHj : 0
    });
  });

  results.sort((a, b) => b.ss - a.ss);
  return results;
}

function channelHTML(rows) {
  const validRows = rows.filter(r => !String(r['娌荤枟鏄庣粏'] || '').includes('鏇存崲鍖荤敓'));
  // 鎴愪氦鍒ゅ畾
  const isDeal = r => {
    if (r['鍒濆璇?] === '閫€璐?) return false;
    const ss = Number(r['瀹炴敹'] || 0);
    const ys = Number(r['搴旀敹'] || 0);
    if ((ss === 0 || ss === 1) && (ys === 0 || ys === 1)) return false;
    if (isNoDeal(r)) return false;
    return true;
  };
  // 鏄惁鍒濊瘖鎴栧璇?鎺掗櫎瀛ょ珛琛?涓嶇畻浜哄ご/鍒伴櫌)
  const isCzFz = r => (r['鍒濆璇?] === '鍒濊瘖' || r['鍒濆璇?] === '澶嶈瘖') && !r._orphan;
  // 鏄惁鍚垵璇?(鐢ㄤ簬鎴愪氦閲戦,鎺掗櫎瀛ょ珛琛?
  const isCzFz1 = r => (r['鍒濆璇?] === '鍒濊瘖' || r['鍒濆璇?] === '澶嶈瘖' || r['鍒濆璇?] === '鍒濊瘖1') && !r._orphan;
  const isBig = r => BIG_PROJECTS.includes(r['椤圭洰']);
  const isSmall = r => SMALL_PROJECTS.includes(r['椤圭洰']);

  // 璁＄畻鏌愮粍鏁版嵁鐨勬笭閬撴寚鏍?  function calcChan(sub) {
    // 鎬诲埌闄?= 鍒濊瘖+澶嶈瘖琛屾暟(鎸夊ぇ椤圭洰/闈炲ぇ椤规媶鍒?
    const czFz = sub.filter(isCzFz);
    const visitBig = czFz.filter(isBig).length;
    const visitSmall = czFz.filter(isSmall).length;
    // 鎴愪氦鏁?= 鍒濊瘖+澶嶈瘖涓璱sDeal鐨勮鏁?    const dealCzFz = czFz.filter(isDeal);
    const dealBig = dealCzFz.filter(isBig).length;
    const dealSmall = dealCzFz.filter(isSmall).length;
    // 鎴愪氦鐜?    const rateBig = visitBig > 0 ? dealBig / visitBig : 0;
    const rateSmall = visitSmall > 0 ? dealSmall / visitSmall : 0;
    // 鎴愪氦閲戦 = 鍒濊瘖+澶嶈瘖+鍒濊瘖1鐨勫疄鏀朵箣鍜?鎸夊ぇ椤圭洰/闈炲ぇ椤?
    const czFz1 = sub.filter(isCzFz1);
    const amtBig = czFz1.filter(isBig).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    const amtSmall = czFz1.filter(isSmall).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 涓氱哗 = 鍒濊瘖+澶嶈瘖+鍐嶆秷璐圭殑瀹炴敹涔嬪拰(涓汉涓氱哗,鍜岀粡钀ユ姤琛ㄥ彛寰勪竴鑷?
    const yj = sub.filter(r => r['鍒濆璇?] === '鍒濊瘖' || r['鍒濆璇?] === '澶嶈瘖' || r['鍒濆璇?] === '鍐嶆秷璐?).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 涓汉缁嗚妭:鎸夊垵澶嶈瘖鍒嗙被鐨勪笟缁?    const yjCz = sub.filter(r => r['鍒濆璇?] === '鍒濊瘖').reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    const yjFz = sub.filter(r => r['鍒濆璇?] === '澶嶈瘖').reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    const yjZxf = sub.filter(r => r['鍒濆璇?] === '鍐嶆秷璐?).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    const yjFc = sub.filter(r => r['鍒濆璇?] === '澶嶆煡').reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 浜烘暟(鎸夎,涓嶅幓閲?
    const nCz = sub.filter(r => r['鍒濆璇?] === '鍒濊瘖').length;
    const nFz = sub.filter(r => r['鍒濆璇?] === '澶嶈瘖').length;
    const nZxf = sub.filter(r => r['鍒濆璇?] === '鍐嶆秷璐?).length;
    const nFc = sub.filter(r => r['鍒濆璇?] === '澶嶆煡').length;
    // 鎴愪氦浜烘暟(鎸夎)
    const nDealCz = sub.filter(r => r['鍒濆璇?] === '鍒濊瘖' && isDeal(r)).length;
    const nDealFz = sub.filter(r => r['鍒濆璇?] === '澶嶈瘖' && isDeal(r)).length;
    // 瀹炴敹 = 搴旀敹>0琛屽疄鏀?鎵€鏈夌被鍒? + 涓氱哗绫诲簲鏀?0涓斿疄鏀?0琛屽疄鏀?2026-07-01瀵归綈浜哄伐)
    const ss = sub.reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 鏀舵瑺璐?= 搴旀敹=0+瀹炴敹>0+鍒濆璇?澶嶆煡 鐨?瀹炴敹(2026-07-01瀵归綈浜哄伐鎴浘)
    const sq = sub.filter(r => Number(r['搴旀敹']) === 0 && Number(r['瀹炴敹']) > 0 && r['鍒濆璇?] === '澶嶆煡').reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);
    // 閫€璐?    const tf = Math.abs(sub.filter(r => r['鍒濆璇?] === '閫€璐?).reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0));
    return { visitBig, visitSmall, dealBig, dealSmall, rateBig, rateSmall, amtBig, amtSmall, yj, yjCz, yjFz, yjZxf, yjFc, nCz, nFz, nZxf, nFc, nDealCz, nDealFz, ss, sq, tf, hj: ss };
  }

  // 璁＄畻鎬诲悎璁?鐢ㄤ簬涓氱哗鍗犳瘮鍒嗘瘝, 2026-07-05鐢ㄦ埛纭鐢ㄥ悎璁″彛寰? ss+sq-tf)
  const totalHj = validRows.reduce((a, r) => a + (Number(r['瀹炴敹']) || 0), 0);

  // 1. 甯傚満涓撳憳琛?鍔ㄦ€佽鍙?涓嶉檺瀹氬悕鍗曗€斺€斿叆鑱岀鑱岄绻?
  const mktRows = validRows.filter(r => String(r['涓€绾ф笭閬?] || '').trim() === '甯傚満' || String(r['涓€绾ф笭閬?] || '').trim() === '甯傚満閮? || String(r['涓€绾ф笭閬?] || '').trim() === '甯傚満浜岄儴');
  // 鎸変簩绾ф笭閬?涓撳憳鍚?鍒嗙粍,鑷姩璇嗗埆鎵€鏈夊競鍦轰笓鍛?  const staffGroups = {};
  mktRows.forEach(r => {
    const name = String(r['浜岀骇娓犻亾'] || '').trim();
    if (!name) return;
    if (!staffGroups[name]) staffGroups[name] = [];
    staffGroups[name].push(r);
  });
  // 鎸夊疄鏀堕檷搴忔帓鍒楁墍鏈変笓鍛?  const staffData = Object.keys(staffGroups).map(name => {
    const sub = staffGroups[name];
    const d = calcChan(sub);
    return { name, ...d, pct: totalHj > 0 ? d.hj / totalHj : 0, isEmpty: false };
  }).sort((a, b) => b.ss - a.ss);
  // 甯傚満鎬昏
  const mktTotal = calcChan(mktRows);

  // 2. 鍏朵粬娓犻亾澶х被(鍚?绗笁娓犻亾"绗旇褰掑叆绗笁鏂? "鍛樺伐浠嬬粛"鍗曞垪)
  const chanOrder = [
    { key: '缇庡洟/楂樺痉', filter: r => ['鍥㈣喘', '缇庡洟', '绾夸笂'].includes(String(r['涓€绾ф笭閬?] || '').trim()) },
    { key: '鑷劧鍒伴櫌', filter: r => ['鑷劧涓婇棬', '鑷劧鍒拌瘖'].includes(String(r['涓€绾ф笭閬?] || '').trim()) },
    { key: '杞粙缁?, filter: r => String(r['涓€绾ф笭閬?] || '').trim() === '杞粙缁? },
    { key: '绗笁鏂?, filter: r => ['绗笁鏂?, '绗笁娓犻亾'].includes(String(r['涓€绾ф笭閬?] || '').trim()) },
    { key: '鍛樺伐浠嬬粛', filter: r => String(r['涓€绾ф笭閬?] || '').trim() === '鍛樺伐浠嬬粛' },
  ];
  const chanData = chanOrder.map(c => {
    const sub = validRows.filter(c.filter);
    const d = calcChan(sub);
    return { name: c.key, ...d, pct: totalHj > 0 ? d.hj / totalHj : 0 };
  });

  // 3. 鎬昏
  const grandTotal = calcChan(validRows);

  // 娓叉煋HTML(涓ユ牸鎸夋ā鏉? A娓犻亾 B涓撳憳 C涓氱哗鍗犳瘮 D-E鎬诲埌闄?F-G鎴愪氦鏁?H-I鎴愪氦鐜?J-K鎴愪氦閲戦 L瀹炴敹 M鏀舵瑺璐?N閫€璐?O鍚堣)
  let html = `<div class="audit-section">
    <h2>馃摗 娓犻亾鏁版嵁锛堝垵/澶嶏級</h2>
    <table class="tmpl-table">
      <tr><td class="tmpl-title" colspan="15">娓犻亾鏁版嵁锛堝垵/澶嶏級</td></tr>
      <tr class="row-header">
        <td rowspan="2">娓犻亾</td><td rowspan="2">涓撳憳</td><td rowspan="2">涓氱哗鍗犳瘮</td>
        <td colspan="2">鎬诲埌闄?/td><td colspan="2">鎴愪氦鏁?/td><td colspan="2">鎴愪氦鐜?/td><td colspan="2">鎴愪氦閲戦</td>
        <td rowspan="2">瀹炴敹</td><td rowspan="2">鏀舵瑺璐?/td><td rowspan="2" class="text-red">閫€璐?/td><td rowspan="2">鍚堣</td>
      </tr>
      <tr class="row-header">
        <td>澶ч」鐩?/td><td>闈炲ぇ椤?/td>
        <td>澶ч」鐩?/td><td>闈炲ぇ椤?/td>
        <td>澶ч」鐩?/td><td>闈炲ぇ椤?/td>
        <td>澶ч」鐩?/td><td>闈炲ぇ椤?/td>
      </tr>`;

  // 甯傚満涓撳憳琛?鍔ㄦ€佹樉绀烘墍鏈変笓鍛?鎸夊疄鏀堕檷搴?
  staffData.forEach(d => {
    html += `<tr>
      <td>甯傚満</td><td>${d.name}</td>
      <td>${(d.pct * 100).toFixed(2)}%</td>
      <td>${d.visitBig}</td><td>${d.visitSmall}</td>
      <td>${d.dealBig}</td><td>${d.dealSmall}</td>
      <td>${(d.rateBig * 100).toFixed(2)}%</td><td>${(d.rateSmall * 100).toFixed(2)}%</td>
      <td>${fmt(d.amtBig)}</td><td>${fmt(d.amtSmall)}</td>
      <td>${fmt(d.ss)}</td><td>${fmt(d.sq)}</td><td class="text-red">${fmt(d.tf)}</td><td>${fmt(d.hj)}</td>
    </tr>`;
  });
  // 鍚堣(甯傚満涓撳憳灏忚锛屽榻愭ā鏉縍ow29)
  html += `<tr class="row-total">
    <td></td><td>鍚堣</td>
    <td>${(totalHj > 0 ? mktTotal.hj / totalHj * 100 : 0).toFixed(2)}%</td>
    <td>${mktTotal.visitBig}</td><td>${mktTotal.visitSmall}</td>
    <td>${mktTotal.dealBig}</td><td>${mktTotal.dealSmall}</td>
    <td>${(mktTotal.rateBig * 100).toFixed(2)}%</td><td>${(mktTotal.rateSmall * 100).toFixed(2)}%</td>
    <td>${fmt(mktTotal.amtBig)}</td><td>${fmt(mktTotal.amtSmall)}</td>
    <td>${fmt(mktTotal.ss)}</td><td>${fmt(mktTotal.sq)}</td><td class="text-red">${fmt(mktTotal.tf)}</td><td>${fmt(mktTotal.hj)}</td>
  </tr>`;
  // 甯傚満鎬昏
  html += `<tr class="row-total">
    <td colspan="2">甯傚満鎬昏</td>
    <td>${(totalHj > 0 ? mktTotal.hj / totalHj * 100 : 0).toFixed(2)}%</td>
    <td>${mktTotal.visitBig}</td><td>${mktTotal.visitSmall}</td>
    <td>${mktTotal.dealBig}</td><td>${mktTotal.dealSmall}</td>
    <td>${(mktTotal.rateBig * 100).toFixed(2)}%</td><td>${(mktTotal.rateSmall * 100).toFixed(2)}%</td>
    <td>${fmt(mktTotal.amtBig)}</td><td>${fmt(mktTotal.amtSmall)}</td>
    <td>${fmt(mktTotal.ss)}</td><td>${fmt(mktTotal.sq)}</td><td class="text-red">${fmt(mktTotal.tf)}</td><td>${fmt(mktTotal.hj)}</td>
  </tr>`;

  // 鍏朵粬娓犻亾
  chanData.forEach(d => {
    html += `<tr>

    </tr>`;
  });

  // 鎬昏
  html += `<tr class="row-total">
    <td colspan="2">鎬昏</td>
    <td>100.00%</td>
    <td>${grandTotal.visitBig}</td><td>${grandTotal.visitSmall}</td>

  html += `</table></div>`;
  return html;
}

function renderSemiAnnualReport() {
  const months = getMonths().sort(); // 姝ｅ簭(1鏈堚啋6鏈?
  if (months.length === 0) {
    document.getElementById('semiAnnualReport').innerHTML = '<div class="empty-state">鏆傛棤鏁版嵁</div>';
    return;
  }

  // 璁＄畻姣忔湀鍏抽敭鎸囨爣
  const monthlyData = months.map(ym => {
    const rows = filterByMonth(CLEANED, ym);
    const projData = calcProjectSummary(rows);
    const validRows = rows.filter(r => !String(r['娌荤枟鏄庣粏'] || '').includes('鏇存崲鍖荤敓'));
    const isDeal = r => {
      if (r['鍒濆璇?] === '閫€璐?) return false;
      const ss = Number(r['瀹炴敹'] || 0); const ys = Number(r['搴旀敹'] || 0);
      if ((ss === 0 || ss === 1) && (ys === 0 || ys === 1)) return false;
      if (isNoDeal(r)) return false;
      return true;
    };
    const cz = validRows.filter(r => r['鍒濆璇?] === '鍒濊瘖' && !r._orphan);
    const cz_d = cz.filter(isDeal).length;
    const visitSet = new Set(validRows.map(r => r['濮撳悕']));
    const doneSet = new Set(validRows.filter(r => isDeal(r)).map(r => r['濮撳悕']));
    const ss = Object.values(projData).reduce((a, d) => a + d.ss, 0);
    const sq = Object.values(projData).reduce((a, d) => a + d.sq, 0);
    const tf = Object.values(projData).reduce((a, d) => a + d.tf, 0);
    const ys = Object.values(projData).reduce((a, d) => a + d.ys, 0);
    const hj = ss; // 鍏ㄩ噺瀹炴敹宸插惈鏀舵瑺璐?閫€璐? 2026-07-08
    const fz_n = Object.values(projData).reduce((a, d) => a + d.fz_n, 0);
    const fz_d = Object.values(projData).reduce((a, d) => a + d.fz_d, 0);
    const ff_n = Object.values(projData).reduce((a, d) => a + d.ff_n, 0);
    const ff_d = Object.values(projData).reduce((a, d) => a + d.ff_d, 0);
    const zxf_n = Object.values(projData).reduce((a, d) => a + d.zxf_n, 0);
    const totalD = Object.values(projData).reduce((a, d) => a + d.fz_d + d.ff_d + d.zxf_d, 0);
    const ysNoTf = Object.values(projData).reduce((a, d) => a + d.ys_no_tf, 0);
    const cz1D = Object.values(projData).reduce((a, d) => a + (d.cz1_d || 0), 0);
    const totalDUnit = totalD + cz1D;
    const unit = totalDUnit > 0 ? ysNoTf / totalDUnit : 0;
    const unitPrice = doneSet.size > 0 ? ss / doneSet.size : 0;
    const czRate = fz_n > 0 ? fz_d / fz_n : 0;
    return {
      ym, rows: rows.length, validRows: validRows.length,
      ss, sq, tf, ys, hj, unit, unitPrice, czRate,

function buildAudit(rows, projData) {
  const audit = { summary: {}, dataQuality: [], kpiAnalysis: [], risks: [], suggestions: [] };
  // 鍩虹缁熻
  const validRows = rows.filter(r => !String(r['娌荤枟鏄庣粏'] || '').includes('鏇存崲鍖荤敓'));
  const cz = validRows.filter(r => r['鍒濆璇?] === '鍒濊瘖' && !r._orphan);
  const fz = validRows.filter(r => r['鍒濆璇?] === '澶嶈瘖' && !r._orphan);
  const zxf = validRows.filter(r => r['鍒濆璇?] === '鍐嶆秷璐? && !r._orphan);
  const fc = validRows.filter(r => r['鍒濆璇?] === '澶嶆煡' && !r._orphan);
  const tf = validRows.filter(r => r['鍒濆璇?] === '閫€璐? && !r._orphan);
  // 鎴愪氦鍒ゅ畾(2026-06-24鏇存柊): 瑙乧alcProjectSummary鐨刬sDeal娉ㄩ噴
  const isDeal = r => {
    if (r['鍒濆璇?] === '閫€璐?) return false;
    const ss4 = Number(r['瀹炴敹'] || 0);
    const ys4 = Number(r['搴旀敹'] || 0);
    if ((ss4 === 0 || ss4 === 1) && (ys4 === 0 || ys4 === 1)) return false;
    if (isNoDeal(r)) return false;
    return true;
  };
  const cz_d = cz.filter(isDeal).length;
  const fz_d = fz.filter(isDeal).length;
  const ss = Object.values(projData).reduce((a, d) => a + d.ss, 0);
  const sq = Object.values(projData).reduce((a, d) => a + d.sq, 0);
  const tfAmt = Object.values(projData).reduce((a, d) => a + d.tf, 0);
  const hj = ss; // 鍏ㄩ噺瀹炴敹宸插惈鏀舵瑺璐?閫€璐? 2026-07-08
  const totalVisit = cz.length + fz.length + zxf.length;
  const czRate = cz.length > 0 ? cz_d / cz.length : 0;
  // 鍗曚綋 = 鎺掗櫎閫€璐圭殑鎬诲簲鏀?梅 鎬绘垚浜?鍒濊瘖+鍒濊瘖1鍏ㄩ儴+澶嶈瘖+鍐嶆秷璐?(2026-07-02鐢ㄦ埛纭: 閫€璐逛笉绠楀叆鍗曚綋, 鍒濊瘖1绠楀叆鍒嗘瘝涓斾笉鍒ゆ垚浜?
  const totalYsNoTf = validRows.filter(r => r['鍒濆璇?] !== '閫€璐?).reduce((a, r) => a + (Number(r['搴旀敹']) || 0), 0);
  const cz1Rows = validRows.filter(r => r['鍒濆璇?] === '鍒濊瘖1' && !r._orphan);
  const cz1_d = cz1Rows.length;
  const fz_d_audit = fz.filter(isDeal).length;
  const ff_d_audit = fz.filter(isDeal).length;
  const zxf_d_audit = zxf.filter(isDeal).length;
  const totalDeal = cz_d + cz1_d + ff_d_audit + zxf_d_audit;
  const unit = totalDeal > 0 ? totalYsNoTf / totalDeal : 0;

  // 1. 姒傝
  audit.summary = {

  };

  // 2. 鏁版嵁璐ㄩ噺瀹℃牳
  // 缂哄け鍊?  const missDoc = rows.filter(r => !r['鍖荤敓'] || r['鍖荤敓'] === '鏈寚娲?).length;
  const missChan = rows.filter(r => !r['涓€绾ф笭閬?] || r['涓€绾ф笭閬?] === '鏈煡').length;

  // 寮傚父鍊?  const negAmt = rows.filter(r => r['瀹炴敹'] < 0 && r['鍒濆璇?] !== '閫€璐?).length;
  const ysNeqSs = rows.filter(r => r['搴旀敹'] > 0 && r['搴旀敹'] !== r['瀹炴敹'] && r['瀹炴敹'] > 0).length;
  const ssZeroDeal = rows.filter(r => r['瀹炴敹'] === 0 && isDeal(r)).length;
  // 閫昏緫涓€鑷存€?  const chgDoc = rows.filter(r => String(r['娌荤枟鏄庣粏'] || '').includes('鏇存崲鍖荤敓')).length;
  const orphanEmpty = rows.filter(r => !r['濮撳悕'] || r['濮撳悕'] === '鏈煡').length;

  audit.dataQuality.push(
    { item: '鍖荤敓瀛楁缂哄け', count: missDoc, rate: rows.length > 0 ? missDoc / rows.length : 0, level: missDoc > 50 ? 'err' : (missDoc > 10 ? 'warn' : 'ok'), desc: '鏈寚娲惧尰鐢熺殑璁板綍鍙兘褰卞搷涓氱哗褰掑睘' },
    { item: '娓犻亾瀛楁缂哄け', count: missChan, rate: rows.length > 0 ? missChan / rows.length : 0, level: missChan > 100 ? 'err' : (missChan > 20 ? 'warn' : 'ok'), desc: '娓犻亾缂哄け褰卞搷鑾峰鍒嗘瀽' },
    { item: '椤圭洰瀛楁缂哄け', count: missProj, rate: rows.length > 0 ? missProj / rows.length : 0, level: missProj > 50 ? 'warn' : 'ok', desc: '椤圭洰褰掔被涓?鍏跺畠"鐨勮褰? },
    { item: '瀹炴敹涓鸿礋(闈為€€璐?', count: negAmt, rate: rows.length > 0 ? negAmt / rows.length : 0, level: negAmt > 0 ? 'warn' : 'ok', desc: '闈為€€璐圭被鍗村疄鏀朵负璐?闇€鏍告煡' },
    { item: '搴旀敹鈮犲疄鏀?鏈夊樊棰?', count: ysNeqSs, rate: rows.length > 0 ? ysNeqSs / rows.length : 0, level: 'info', desc: '瀛樺湪娆犳/鎶归浂,姝ｅ父鐜拌薄' },
    { item: '鎴愪氦浣嗗疄鏀?0', count: ssZeroDeal, rate: rows.length > 0 ? ssZeroDeal / rows.length : 0, level: ssZeroDeal > 100 ? 'warn' : 'info', desc: '闈炴湭鎴愪氦浣嗗疄鏀朵负0(濡傛磥鐗欏崱/璧犻€?' },
    { item: '鏇存崲鍖荤敓璁板綍', count: chgDoc, rate: rows.length > 0 ? chgDoc / rows.length : 0, level: chgDoc > 0 ? 'info' : 'ok', desc: '鍖荤敓鍙樻洿鎿嶄綔,宸蹭粠涓氱哗涓墧闄? },
    { item: '濮撳悕缂哄け/鏈煡', count: orphanEmpty, rate: rows.length > 0 ? orphanEmpty / rows.length : 0, level: orphanEmpty > 10 ? 'warn' : 'ok', desc: '瀛ょ珛琛屾垨褰曞叆閬楁紡' },
  );

  // 3. 缁忚惀鎸囨爣娣卞害鍒嗘瀽
  // 椤圭洰缁撴瀯
  const projArr = PROJ_ORDER.map(p => ({ name: p, ...projData[p] })).filter(p => p.fz_n + p.ff_n + p.zxf_n > 0 || p.ss > 0);
  const totalSs = projArr.reduce((a, p) => a + p.ss, 0);
  projArr.forEach(p => { p.ssPct = totalSs > 0 ? p.ss / totalSs : 0; });
  const topProj = [...projArr].sort((a, b) => b.ss - a.ss)[0];
  const top2Proj = [...projArr].sort((a, b) => b.ss - a.ss).slice(0, 2);
  const top2ProjPct = top2Proj.reduce((a, p) => a + p.ss, 0) / (totalSs || 1);

  audit.kpiAnalysis.push({
    title: '椤圭洰鏀跺叆缁撴瀯',
    level: top2ProjPct > 0.7 ? 'warn' : 'ok',
    desc: `Top2椤圭洰(${top2Proj.map(p => p.name).join('+')})鍗犳瘮 ${(top2ProjPct * 100).toFixed(2)}%锛?{top2ProjPct > 0.7 ? '杩囧害闆嗕腑' : '缁撴瀯鐩稿鍧囪　'}`,
    data: projArr.map(p => ({ name: p.name, ss: p.ss, pct: p.ssPct, cz: p.fz_n, cz_d: p.fz_d, czRate: p.fz_n > 0 ? p.fz_d / p.fz_n : 0 }))
  });

  // 鍒濊瘖鎴愪氦鐜?  const czRateData = projArr.filter(p => p.fz_n > 0).map(p => ({ name: p.name, cz: p.fz_n, cz_d: p.fz_d, rate: p.fz_d / p.fz_n }));
  const lowCzRate = czRateData.filter(p => p.rate < 0.5);
  audit.kpiAnalysis.push({
    title: '鍒濊瘖鎴愪氦鐜?,
    level: czRate < 0.6 ? 'warn' : (czRate < 0.4 ? 'err' : 'ok'),
    desc: `鏁翠綋鍒濊瘖鎴愪氦鐜?${(czRate * 100).toFixed(2)}%锛?{czRate < 0.6 ? '鍋忎綆' : '鍋ュ悍'}銆?{lowCzRate.length > 0 ? '鎴愪氦鐜囦綆浜?0%鐨勯」鐩細' + lowCzRate.map(p => p.name + '(' + (p.rate * 100).toFixed(1) + '%)').join('銆?) : '鍚勯」鐩垚浜ょ巼鍧団墺50%'}`,
    data: czRateData
  });

  // 鍖荤敓闆嗕腑搴?  const docAmt = {};
  validRows.forEach(r => { if (r['鍖荤敓'] && r['鍖荤敓'] !== '鏈寚娲?) docAmt[r['鍖荤敓']] = (docAmt[r['鍖荤敓']] || 0) + r['瀹炴敹']; });
  const docArr = Object.entries(docAmt).map(([name, amt]) => ({ name, amt })).sort((a, b) => b.amt - a.amt);
  const docTotal = docArr.reduce((a, d) => a + d.amt, 0);
  const top2Doc = docArr.slice(0, 2);
  const top2DocPct = top2Doc.reduce((a, d) => a + d.amt, 0) / (docTotal || 1);
  audit.kpiAnalysis.push({
    title: '鍖荤敓涓氱哗闆嗕腑搴?,
    level: top2DocPct > 0.6 ? 'warn' : (top2DocPct > 0.5 ? 'info' : 'ok'),
    desc: `Top2鍖荤敓(${top2Doc.map(d => d.name).join('+')})鍗犳瘮 ${(top2DocPct * 100).toFixed(2)}%锛?{top2DocPct > 0.6 ? '浜哄憳渚濊禆椋庨櫓楂? : '姊槦杈冨仴搴?}`,
    data: docArr.slice(0, 8).map(d => ({ name: d.name, amt: d.amt, pct: d.amt / (docTotal || 1) }))
  });

  // 娓犻亾缁撴瀯
  const chanAmt = {};
  validRows.forEach(r => { const c = r['涓€绾ф笭閬?] || '鏈煡'; chanAmt[c] = (chanAmt[c] || 0) + r['瀹炴敹']; });
  const chanArr = Object.entries(chanAmt).map(([name, amt]) => ({ name, amt })).sort((a, b) => b.amt - a.amt);
  audit.kpiAnalysis.push({

  // 4. 椋庨櫓棰勮
  if (czRate < 0.5) audit.risks.push({ level: 'err', title: '鍒濊瘖鎴愪氦鐜囪繃浣?, desc: `鏁翠綋鍒濊瘖鎴愪氦鐜囦粎 ${(czRate * 100).toFixed(2)}%锛屼綆浜?0%璀︽垝绾縛, action: '鎺掓煡鍒濊瘖鏈垚浜ゅ師鍥?鍔犲己鍜ㄨ甯堣瘽鏈煿璁? });
  else if (czRate < 0.6) audit.risks.push({ level: 'warn', title: '鍒濊瘖鎴愪氦鐜囧亸浣?, desc: `鏁翠綋鍒濊瘖鎴愪氦鐜?${(czRate * 100).toFixed(2)}%锛屼綆浜?0%`, action: '鍏虫敞浣庢垚浜ょ巼椤圭洰,浼樺寲杞寲娴佺▼' });
  if (top2DocPct > 0.6) audit.risks.push({ level: 'warn', title: '鍖荤敓杩囧害闆嗕腑', desc: `Top2鍖荤敓鍗犳瘮 ${(top2DocPct * 100).toFixed(2)}%锛?60%`, action: '鍩瑰吇姊槦鍖荤敓,鍒嗘祦浣庡鏉傚害鐥呬緥' });
  if (top2ProjPct > 0.7) audit.risks.push({ level: 'warn', title: '椤圭洰缁撴瀯鍗曚竴', desc: `Top2椤圭洰鍗犳瘮 ${(top2ProjPct * 100).toFixed(2)}%锛?70%`, action: '鎷撳睍楂樻瘺鍒╅」鐩?闄嶄綆鍗曢」鐩緷璧? });
  if (tfAmt > ss * 0.05) audit.risks.push({ level: 'warn', title: '閫€璐圭巼鍋忛珮', desc: `閫€璐?${fmt(tfAmt)} 鍗犲疄鏀?${(tfAmt / ss * 100).toFixed(2)}%锛?5%`, action: '鏍告煡閫€璐瑰師鍥?鍔犲己鏈悗鏈嶅姟涓庡鎯呯淮鎶? });
  if (missDoc > 50) audit.risks.push({ level: 'warn', title: '鍖荤敓瀛楁澶ч噺缂哄け', desc: `${missDoc} 鏉¤褰曟湭鎸囨淳鍖荤敓`, action: '瑕佹眰鍓嶅彴瑙勮寖褰曞叆,琛ュ厖鍘嗗彶鏁版嵁' });
  // 鏃ュ潎鍒拌瘖
  const days = new Set(validRows.map(r => r['鏃ユ湡'].toDateString())).size;

  // 娆犺垂鐜?  if (sq > ss * 0.4) audit.risks.push({ level: 'warn', title: '鏀舵瑺璐瑰崰姣斿亸楂?, desc: `鏀舵瑺璐?${fmt(sq)} 鍗犲疄鏀?${(sq / ss * 100).toFixed(2)}%锛?40%`, action: '鍔犲己娆犳鍌敹,鎺у埗鏂版瑺浜х敓' });

  // 5. 鏀硅繘寤鸿
  audit.suggestions.push({
    title: '馃搳 缁忚惀鏁版嵁姒傝',
    level: 'info',
    desc: `${CURRENT_MONTH}鏈堟湁鏁堣褰?{validRows.length}鏉★紝鍒濊瘖${cz.length}浜?鎴愪氦${cz_d})锛屽璇?{fz.length}浜猴紝鍐嶆秷璐?{zxf.length}浜猴紝澶嶆煡${fc.length}浜恒€傛€诲疄鏀?{fmt(ss)}锛屾敹娆犺垂${fmt(sq)}锛岄€€璐?{fmt(tfAmt)}锛屽悎璁?{fmt(hj)}銆傚鍗曚环${fmt(unit)}銆俙
  });
  if (czRate < 0.6) audit.suggestions.push({
    title: '馃幆 鎻愬崌鍒濊瘖鎴愪氦鐜?,
    level: czRate < 0.5 ? 'err' : 'warn',
    desc: `褰撳墠鍒濊瘖鎴愪氦鐜?{(czRate * 100).toFixed(2)}%銆?{lowCzRate.length > 0 ? '閲嶇偣鍏虫敞锛? + lowCzRate.map(p => p.name + '(' + (p.rate * 100).toFixed(1) + '%)').join('銆?) + '銆? : ''}寤鸿锛氣憼鍔犲己鍜ㄨ甯堝垵璇婃帴璇婅瘽鏈煿璁紱鈶′紭鍖栧垵璇婃祦绋嬩綋楠岋紱鈶㈠鏈垚浜ゅ垵璇婂鎴?鏃ュ唴鍥炶銆俙,
    action: '鐩爣锛氫笅鏈堟垚浜ょ巼鎻愬崌鑷?0%+'

  if (top2DocPct > 0.5) audit.suggestions.push({
    title: '馃懃 闄嶄綆鍖荤敓渚濊禆',

    desc: `Top2鍖荤敓(${top2Doc.map(d => d.name).join('銆?)})鍗犳瘮${(top2DocPct * 100).toFixed(2)}%銆傚缓璁細鈶犲煿鍏?-3鍚嶆闃熷尰鐢燂紱鈶″皢甯歌鐥呬緥(娲佺墮/鍏呭～)鍒嗘祦缁欏勾杞诲尰鐢燂紱鈶㈠缓绔嬪尰鐢熷甫鏁欐満鍒躲€俙,
    action: '鐩爣锛歍op2鍗犳瘮闄嶈嚦50%浠ュ唴'
  });
  // 楂樹环鍊兼尳鍥?  const undealCz = cz.filter(r => !isDeal(r));
  const undealCzNames = [...new Set(undealCz.map(r => r['濮撳悕']))];
  if (undealCzNames.length > 0) {
    audit.suggestions.push({
      title: '馃挵 鏈垚浜ゅ垵璇婃尳鍥?,
      level: 'info',
      desc: `鏈湀${undealCzNames.length}浣嶅垵璇婂鎴锋湭鎴愪氦銆傚缓璁?鏃ュ唴鐢卞挩璇㈠笀閫愪竴鍥炶,浜嗚В鏈垚浜ゅ師鍥犲苟鍒跺畾涓€у寲鏂规銆傞珮浠峰€奸」鐩?绉嶆/姝ｇ暩)浼樺厛鎸藉洖銆俙,
      action: `棰勮鎸藉洖${Math.round(undealCzNames.length * 0.3)}浜?鎸夊鍗曚环${fmt(unit)}浼扮畻鍙鏀?{fmt(undealCzNames.length * 0.3 * unit)}`
    });
  }
  // 閫€璐瑰垎鏋?  if (tf.length > 0) {
    audit.suggestions.push({
      title: '鈿狅笍 閫€璐瑰鎴峰垎鏋?,
      level: tfAmt > ss * 0.03 ? 'warn' : 'info',
      desc: `鏈湀閫€璐?{tf.length}绗?閲戦${fmt(tfAmt)}銆傚缓璁細鈶犻€愮瑪鏍告煡閫€璐瑰師鍥狅紱鈶″閫€璐瑰鎴峰仛婊℃剰搴﹀洖璁匡紱鈶㈠垎鏋愭槸鍚﹂泦涓湪鏌愬尰鐢?椤圭洰銆俙,
      action: '鐩爣锛氫笅鏈堥€€璐圭巼闄嶈嚦3%浠ュ唴'
    });
  }
  // 澶嶆煡浠峰€?  if (fc.length > 0) {
    const fcAmt = fc.reduce((a, r) => a + r['瀹炴敹'], 0);
    audit.suggestions.push({
      title: '馃攧 澶嶆煡瀹㈡埛杩愯惀',
      level: 'info',
      desc: `鏈湀澶嶆煡${fc.length}浜烘,璐＄尞涓氱哗${fmt(fcAmt)}(鍗犳€诲疄鏀?{(fcAmt / (ss || 1) * 100).toFixed(2)}%)銆傚鏌ユ槸瀹㈡埛缁存姢鍨嬫秷璐?寤鸿锛氣憼寤虹珛澶嶆煡鎻愰啋绯荤粺锛涒憽灏嗗鏌ヤ綔涓哄啀娑堣垂鍏ュ彛,杞寲楂樹环鍊奸」鐩€俙,
      action: '鐩爣锛氬鏌ヨ浆鍖栧啀娑堣垂鐜囨彁鍗囪嚦15%'
    });
  }
  return audit;
}

// 缁欒搴旂敤鏍峰紡, colFmt鏁扮粍鎸囧畾姣忓垪鏍煎紡('int'/'amt'/'pct'/'text'/null), rateColIdx鎸囧畾鎴愪氦鐜囧垪(鐢ㄩ潚鑹?, tfColIdx鎸囧畾閫€璐瑰垪(鐢ㄧ孩鑹?
function styleRowFmt(ws, rowIdx, colCount, baseStyle, redStyle, colFmt, rateColIdx, tfColIdx) {
  for (let c = 0; c < colCount; c++) {
    const addr = XLSX.utils.encode_cell({ r: rowIdx, c });
    if (!ws[addr]) ws[addr] = { v: '' };
    // 鍩虹鏍峰紡: 鎴愪氦鐜囧垪鐢╮ateCol/totalRate, 閫€璐瑰垪鐢╮edStyle
    let s;
    if (rateColIdx && rateColIdx.includes(c)) {
      s = (baseStyle === XLSX_STYLE.header) ? XLSX_STYLE.rateCol : (baseStyle === XLSX_STYLE.total ? XLSX_STYLE.totalRate : baseStyle);
    } else if (tfColIdx && tfColIdx.includes(c)) {
      s = redStyle || baseStyle;
    } else {
      s = baseStyle;
    }
    // 娣辨嫹璐濇牱寮忓苟鍔爊umFmt
    s = JSON.parse(JSON.stringify(s));
    if (colFmt && colFmt[c]) {
      if (colFmt[c] === 'int') s.numFmt = FMT_INT;
      else if (colFmt[c] === 'amt') s.numFmt = FMT_AMT;
      else if (colFmt[c] === 'pct') s.numFmt = FMT_PCT;
    }
    ws[addr].s = s;
  }
}
